# Path in Repo B (the reports repo): .github/workflows/build-dashboard.yml
#
# Triggers whenever new report folders are pushed to main.
# Rebuilds history.json from all reports/<org>/<repo>/<sha>/ folders,
# then publishes history.json + dashboard.html to the gh-pages branch.

name: Build Dashboard

on:
  push:
    branches: ["*"]
    paths:
      - "reports/**"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build history.json
        run: python summarize_reports.py --reports-dir reports --output history.json

      - name: Assemble Pages output
        run: |
          mkdir -p public
          cp history.json public/history.json
          cp dashboard.html public/index.html

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
